<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TOTVS Insight</title>
    <meta
      name="description"
      content="Plataforma de análise de transcrições de reuniões comerciais: indicadores, insights e apoio à decisão."
    />

    <!-- Ferramenta interna: nunca deve ser indexada por buscadores. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#1A1B63" />

    <!--
      Aplica o tema antes do React montar, para não piscar o fundo claro
      quando a preferência salva (ou do SO) é escura.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("totvs-insight-tema");
          var escuro =
            p === "escuro" ||
            ((p === "sistema" || !p) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
